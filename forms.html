<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <!-- form inputs -->
     <form action="">
        <label for="full_name">full name</label>
        <input type="text" name="full_name" id="full_name" placeholder="Enter your full name"><br><br>
        <label for="email">email</label>
        <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>
        <label for="password">password</label>
        <input type="password" name="password" id="password" placeholder="Enter your password" required><br><br>
        <label for="gender">gender</label>
        <input type="radio" name="gender" id="" value="male">
        <label for="male">male</label>
        <input type="radio" name="gender" id="" value="female">
        <label for="female">female</label><br><br>
        <label for="dob">date of birth</label>
        <input type="date" name="dob" id="dob" placeholder="Enter your date of birth"><br><br>
        
        <label for="county">county</label>
        <select name="county" id="county">
            <option value="">select your county</option>
            <option value="nairobi">nairobi</option>
            <option value="kisumu">kisumu</option>
            <option value="mombasa">mombasa</option>
            <option value="kakamega">kakamega</option>

        </select><br><br>
        <button type="submit">submit</button>
     </form>    
</body>
    
</body>
</html>
